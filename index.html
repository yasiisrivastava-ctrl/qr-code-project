<!DOCTYPE html>
<html>
<head>
    <title>My QR Page</title>

    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #667eea, #764ba2);
            font-family: Arial, sans-serif;
            color: white;
            text-align: center;
        }

        .box {
            background: rgba(255,255,255,0.1);
            padding: 40px;
            border-radius: 20px;
            backdrop-filter: blur(10px);
        }

        h1 {
            font-size: 40px;
            animation: fadeIn 2s ease-in-out;
        }

        p {
            font-size: 18px;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>

</head>

<body>

<div class="box">
    <h1>Hi, I'm Yashi Srivastava</h1>
    <p>This is my first QR Code project🧏😉🌱 </p>
</div>

</body>
</html>
